# ---------------------------------------------------------------------------
# Entrega Continua (CD) del microservicio venta.
# Se ejecuta cuando un cambio ya revisado llega a main (merge de un PR):
# construye la imagen, la publica en Amazon ECR y actualiza el Deployment
# del cluster EKS. Es la etapa posterior al workflow de CI (ci.yml).
# ---------------------------------------------------------------------------
name: CD - venta (ECR + EKS)

# Se dispara con cada push a main, o manualmente desde la pestaña Actions
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 456597982359.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: venta
  EKS_CLUSTER: innovatech-eks
  K8S_NAMESPACE: innovatech
  DEPLOYMENT: venta
  CONTAINER: venta

jobs:
  build-push-deploy:
    name: Build → Push ECR → Deploy EKS
    runs-on: ubuntu-latest
    # El despliegue solo corre si la variable de repositorio DEPLOY_EKS vale 'true'
    # (Settings → Variables → Actions). Las credenciales del AWS Academy Learner
    # Lab son temporales: con esta bandera el pipeline no falla cuando el
    # laboratorio esta apagado, y se reactiva cambiando la variable a 'true'.
    if: ${{ vars.DEPLOY_EKS == 'true' }}
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      # Credenciales temporales del AWS Academy Learner Lab (Secrets del repo).
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # El runner de GitHub es amd64, así que la imagen sale compatible con los nodos.
      - name: Build y Push de la imagen
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                       -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Conectar kubectl al clúster
        run: aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER

      - name: Desplegar en EKS
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Aplica el manifiesto (crea o actualiza Deployment, Service, HPA)
          kubectl apply -f k8s/venta.yaml
          # Fija la imagen exacta de este commit y fuerza el rolling update
          kubectl set image deployment/$DEPLOYMENT \
            $CONTAINER=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -n $K8S_NAMESPACE
          # Espera a que el despliegue termine OK (si falla, el pipeline falla)
          kubectl rollout status deployment/$DEPLOYMENT -n $K8S_NAMESPACE --timeout=180s
