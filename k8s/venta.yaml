# ============================================================
# Microservicio VENTA (Spring Boot, puerto 8080)
# - Deployment: corre la imagen desde ECR
# - Service:    expone "venta-service" dentro del clúster (lo usa el nginx del front)
# - HPA:        autoscaling por CPU al 50% (IE3)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: venta
  namespace: innovatech
  labels:
    app: venta
spec:
  replicas: 1
  selector:
    matchLabels:
      app: venta
  template:
    metadata:
      labels:
        app: venta
    spec:
      containers:
        - name: venta
          # El pipeline reemplaza el tag :latest por el SHA del commit en cada deploy.
          image: 456597982359.dkr.ecr.us-east-1.amazonaws.com/venta:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_ENDPOINT
              value: "mysql"          # nombre del Service de MySQL (DNS interno)
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: "venta_db"
            - name: DB_USERNAME
              value: "root"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          resources:
            requests:
              cpu: "250m"             # base del HPA: 50% => escala sobre ~125m
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          # Sondas TCP: el pod se marca "listo" cuando el puerto 8080 responde.
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: venta-service
  namespace: innovatech
  labels:
    app: venta
spec:
  type: ClusterIP
  selector:
    app: venta
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: venta-hpa
  namespace: innovatech
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: venta
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50   # escala cuando el CPU promedio supera 50% (IE3)
